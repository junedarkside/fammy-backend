version: "3"
services:
  web:
    build:
      ./backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    
    command: >
      sh -c "python manage.py makemigrations &&
              python manage.py migrate &&
              python manage.py wait_for_db &&
              python manage.py runserver 0.0.0.0:8000"
              
    # Answer: The variables.env and docker-compose.yml files must be in the same directory.
    environment:
      - DOCKER=true
      - DB_HOST=${POSTGRES_DB_HOST}
      - DB_NAME=${POSTGRES_DB_NAME}
      - DB_USER=${POSTGRES_DB_USER}
      - DB_PASS=${POSTGRES_DB_PASSWORD}

  redis:
      image: redis:latest
      restart: always

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A Smartenplus worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DOCKER=true
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
    depends_on:
      - db
      - redis
      - web

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A Smartenplus beat -l info
    environment:
      - DOCKER=true
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
    depends_on:
      - db
      - redis
      - web

volumes:
  db_data:
  static_volume: